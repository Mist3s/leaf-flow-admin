<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaf Flow Admin</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">LF</div>
      <div>
        <div class="brand-title">Leaf Flow Admin</div>
        <div class="brand-subtitle">Управление товарами через API</div>
      </div>
    </div>
    <nav class="actions">
      <button id="open-docs" class="ghost">Документация API</button>
      <button id="clear-cache" class="danger ghost">Сбросить кеш</button>
    </nav>
  </header>

  <main class="layout" id="app-root">
    <!-- Контент заполняется из main.js -->
  </main>

  <template id="loading-template">
    <div class="loading">
      <div class="spinner"></div>
      <p>Загрузка...</p>
    </div>
  </template>

  <script type="module" src="./main.js"></script>
</body>
</html>
